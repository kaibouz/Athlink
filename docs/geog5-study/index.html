    const STORAGE_KEY = "geog5-lecture-review-v1";

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }
    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    let route = { page: "home", modId: null, tab: "sheet" };
    let flashIndex = 0;

    function $(sel, root = document) {
      return root.querySelector(sel);
    }

    function renderNav() {
      const box = $("#nav-modules");
      const byMod = {};
      MODULES.forEach((m) => {
        (byMod[m.module] ||= []).push(m);
      });
      box.innerHTML = Object.entries(byMod)
        .map(([mod, items]) => {
          const buttons = items
            .map((m) => {
              const active = route.page === "module" && route.modId === m.id ? "active" : "";
              return `<button class="nav-btn ${active}" data-go="module" data-id="${m.id}" type="button">
                ${m.title}
                <span class="meta">${m.week || mod} · ${mod} · ${m.status === "ready" ? "ready" : "coming soon"}</span>
              </button>`;
            })
            .join("");
          return `<p class="nav-label">${mod}</p>${buttons}`;
        })
        .join("");

      document.querySelectorAll(".nav-btn").forEach((btn) => {
        const go = btn.getAttribute("data-go");
        const isActive =
          (go === "home" && route.page === "home") ||
          (go === "progress" && route.page === "progress") ||
          (go === "module" && route.modId === btn.getAttribute("data-id"));
        btn.classList.toggle("active", isActive);
      });
    }

    function progressFor(mod) {
      const checks = state.check?.[mod.id] || {};
      const total = mod.checklist.length || 1;
      const done = mod.checklist.filter((_, i) => checks[i]).length;
      return { done, total, pct: Math.round((done / total) * 100) };
    }

    function overallProgress() {
      let done = 0;
      let total = 0;
      MODULES.forEach((m) => {
        const p = progressFor(m);
        done += p.done;
        total += p.total;
      });
      return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function renderHome() {
      const overall = overallProgress();
      return `
        <h1>Lecture Review</h1>
        <p class="lead">GEOG 5 のモジュール講義を、レクチャーシート・フラッシュカード・確認クイズで復習するローカルサイトです。新しい動画はここに追加していきます。</p>
        <div class="row">
          <span class="pill">Progress ${overall.done}/${overall.total}</span>
          <span class="pill">Modules ${MODULES.filter((m) => m.status === "ready").length} ready</span>
        </div>
        <div class="progress"><span style="width:${overall.pct}%"></span></div>
        <div class="grid-2">
          ${MODULES.map((m) => {
            const p = progressFor(m);
            return `
              <button class="card home-mod" data-go="module" data-id="${m.id}" type="button">
                <div class="row" style="margin:0 0 8px">
                  <span class="pill">${m.module}</span>
                  <span class="pill">${m.status}</span>
                </div>
                <strong>${m.title}</strong>
                <p class="muted" style="margin:8px 0 0">${m.week || ''} · ${m.video}<br />Slides: ${m.slides}<br />${m.due ? m.due + '<br />' : ''}Checklist ${p.done}/${p.total}</p>
              </button>`;
          }).join("")}
        </div>
        <footer>Canonical folder: Desktop/GEOG5-Study · also mirrored in athlink/docs/geog5-study</footer>
      `;
    }

    function renderProgress() {
      return `
        <h1>Progress</h1>
        <p class="lead">チェックはブラウザの localStorage に保存されます。</p>
        ${MODULES.map((m) => {
          const p = progressFor(m);
          return `
            <div class="card">
              <strong>${m.module}: ${m.title}</strong>
              <p class="muted" style="margin:6px 0 10px">${p.done}/${p.total} · ${p.pct}%</p>
              <div class="progress"><span style="width:${p.pct}%"></span></div>
            </div>`;
        }).join("")}
        <button class="tab" id="reset-progress" type="button">Reset all checks</button>
      `;
    }

    function renderModule(mod) {
      if (mod.status !== "ready" || !mod.sheet) {
        return `
          <h1>${mod.title}</h1>
          <p class="lead">${mod.noteHint || "準備中です。講義視聴後に追加します。"}</p>
          <div class="card">
            <p><strong>${mod.module}</strong> · ${mod.video}</p>
            <p class="muted">Slides: ${mod.slides}</p>
            <p>追加待ちのチェック:</p>
            ${mod.checklist
              .map((c, i) => {
                const on = !!(state.check?.[mod.id] || {})[i];
                return `<label class="check"><input type="checkbox" data-check="${mod.id}" data-i="${i}" ${on ? "checked" : ""} /><span>${c}</span></label>`;
              })
              .join("")}
          </div>`;
      }

      const tab = route.tab || "sheet";
      const tabs = ["sheet", "cards", "quiz", "checklist"]
        .map(
          (t) =>
            `<button class="tab ${tab === t ? "on" : ""}" data-tab="${t}" type="button">${
              { sheet: "Lecture sheet", cards: "Flashcards", quiz: "Quick quiz", checklist: "Checklist" }[t]
            }</button>`,
        )
        .join("");

      let body = "";
      if (tab === "sheet") body = renderSheet(mod);
      if (tab === "cards") body = renderCards(mod);
      if (tab === "quiz") body = renderQuiz(mod);
      if (tab === "checklist") body = renderChecklist(mod);

      const p = progressFor(mod);
      return `
        <h1>${mod.title}</h1>
        <p class="lead">${mod.noteHint}</p>
        <div class="row">
          <span class="pill">${mod.module}</span>
          <span class="pill">${mod.video}</span>
          <span class="pill">${mod.slides}</span>
          <span class="pill">Checklist ${p.done}/${p.total}</span>
        </div>
        <div class="tabs">${tabs}</div>
        <div id="mod-body">${body}</div>
      `;
    }

    function renderSheet(mod) {
      const s = mod.sheet;
      return `
        <h2>Definitions</h2>
        <table>
          <tr><th></th><th>English</th><th>日本語</th></tr>
          ${s.definitions
            .map((d) => `<tr><td><strong>${d.label}</strong></td><td>${d.en}</td><td>${d.ja}</td></tr>`)
            .join("")}
        </table>

        <h2>Four spheres</h2>
        <div class="row">${s.spheres.map((x) => `<span class="pill">${x}</span>`).join("")}</div>

        <h2>Realms</h2>
        <pre class="diagram">Physical geography          Human geography
(natural sciences           (social / cultural
 connected over space)       connected over space)
            \\                 /
             Environmental geography
             (humans ↔ environment)
                      |
           Geospatial models & methods
           (maps · GIS · remote sensing)</pre>
        <table>
          <tr><th>Realm</th><th>Asks</th><th>Lecture example</th></tr>
          ${s.realms
            .map((r) => `<tr><td><strong>${r.name}</strong></td><td>${r.ask}</td><td>${r.example}</td></tr>`)
            .join("")}
        </table>

        <h2>Case studies</h2>
        ${s.cases
          .map(
            (c) => `
          <div class="card">
            <h3 style="margin-top:0">${c.title}</h3>
            <ul>${c.points.map((p) => `<li>${p}</li>`).join("")}</ul>
          </div>`,
          )
          .join("")}

        <h2>Tools</h2>
        <div class="card"><ul>${s.tools.map((t) => `<li>${t}</li>`).join("")}</ul></div>

        <h2>Course purpose</h2>
        <div class="card">${s.coursePurpose}</div>
        ${s.watchRead && s.watchRead.length ? ("<h2>Watch / Read / Do</h2><div class=\"card\"><ul>" + s.watchRead.map((x) => "<li>" + x + "</li>").join("") + "</ul></div>") : ""}
        ${s.objectives && s.objectives.length ? ("<h2>Learning objectives</h2><div class=\"card\"><ul>" + s.objectives.map((x) => "<li>" + x + "</li>").join("") + "</ul></div>") : ""}
        ${s.labParts && s.labParts.length ? ("<h2>Lab structure</h2><div class=\"card\"><ul>" + s.labParts.map((p) => "<li><strong>Part " + p.part + "</strong> (" + p.pts + " pts): " + p.focus + "</li>").join("") + "</ul></div>") : ""}
      `;
    }

    function renderCards(mod) {
      if (!mod.cards.length) return `<p class="muted">No cards yet.</p>`;
      flashIndex = Math.min(flashIndex, mod.cards.length - 1);
      const card = mod.cards[flashIndex];
      return `
        <p class="muted">${flashIndex + 1} / ${mod.cards.length} · click card to flip</p>
        <div class="card flash" id="flash-card">
          <div class="q">${card.q}</div>
          <div class="a"><strong>Answer:</strong> ${card.a}</div>
        </div>
        <div class="row">
          <button class="tab" id="flash-prev" type="button">Prev</button>
          <button class="tab" id="flash-next" type="button">Next</button>
        </div>
      `;
    }

    function renderQuiz(mod) {
      if (!mod.quiz.length) return `<p class="muted">No quiz yet.</p>`;
      const answers = state.quiz?.[mod.id] || {};
      return mod.quiz
        .map((item, qi) => {
          const chosen = answers[qi];
          const opts = item.choices
            .map((c, ci) => {
              let cls = "quiz-opt";
              if (chosen !== undefined) {
                if (ci === item.answer) cls += " correct";
                else if (ci === chosen) cls += " wrong";
              }
              return `<button class="${cls}" data-quiz="${mod.id}" data-qi="${qi}" data-ci="${ci}" type="button">${c}</button>`;
            })
            .join("");
          return `<div class="card"><strong>Q${qi + 1}. ${item.q}</strong><div style="margin-top:8px">${opts}</div></div>`;
        })
        .join("");
    }

    function renderChecklist(mod) {
      const checks = state.check?.[mod.id] || {};
      return `
        <div class="card">
          ${mod.checklist
            .map((c, i) => {
              const on = !!checks[i];
              return `<label class="check"><input type="checkbox" data-check="${mod.id}" data-i="${i}" ${on ? "checked" : ""} /><span>${c}</span></label>`;
            })
            .join("")}
        </div>`;
    }

    function render() {
      renderNav();
      const app = $("#app");
      if (route.page === "home") app.innerHTML = renderHome();
      else if (route.page === "progress") app.innerHTML = renderProgress();
      else {
        const mod = MODULES.find((m) => m.id === route.modId) || MODULES[0];
        app.innerHTML = renderModule(mod);
      }
      bind();
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.addEventListener("click", () => {
          const go = el.getAttribute("data-go");
          if (go === "home") route = { page: "home", modId: null, tab: "sheet" };
          else if (go === "progress") route = { page: "progress", modId: null, tab: "sheet" };
          else if (go === "module") {
            route = { page: "module", modId: el.getAttribute("data-id"), tab: "sheet" };
            flashIndex = 0;
          }
          render();
        });
      });

      document.querySelectorAll("[data-tab]").forEach((el) => {
        el.addEventListener("click", () => {
          route.tab = el.getAttribute("data-tab");
          flashIndex = 0;
          render();
        });
      });

      document.querySelectorAll("[data-check]").forEach((el) => {
        el.addEventListener("change", () => {
          const id = el.getAttribute("data-check");
          const i = el.getAttribute("data-i");
          state.check ||= {};
          state.check[id] ||= {};
          state.check[id][i] = el.checked;
          saveState(state);
          render();
        });
      });

      document.querySelectorAll("[data-quiz]").forEach((el) => {
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-quiz");
          const qi = +el.getAttribute("data-qi");
          const ci = +el.getAttribute("data-ci");
          state.quiz ||= {};
          state.quiz[id] ||= {};
          state.quiz[id][qi] = ci;
          saveState(state);
          render();
        });
      });

      const flash = $("#flash-card");
      if (flash) {
        flash.addEventListener("click", () => flash.classList.toggle("show"));
      }
      const prev = $("#flash-prev");
      const next = $("#flash-next");
      const mod = MODULES.find((m) => m.id === route.modId);
      if (prev && mod) {
        prev.addEventListener("click", () => {
          flashIndex = (flashIndex - 1 + mod.cards.length) % mod.cards.length;
          render();
        });
      }
      if (next && mod) {
        next.addEventListener("click", () => {
          flashIndex = (flashIndex + 1) % mod.cards.length;
          render();
        });
      }

      const reset = $("#reset-progress");
      if (reset) {
        reset.addEventListener("click", () => {
          state = {};
          saveState(state);
          render();
        });
      }
    }

    render();
  </script>
</body>
</html>
