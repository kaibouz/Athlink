<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AthlinkPro — Mobile App Concepts</title>
<style>
  :root{--bg:#05070c;--panel:#0b0f1a;--panel-2:#10162a;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);--text:#f5f7fa;--dim:#9aa3b2;--dimmer:#5f6773;--blue-1:#3b6ef6;--blue-2:#22c7e0;--clay-1:#3b6ef6;--clay-2:#22c7e0;--accent:#22c7e0;--accent-soft:rgba(59,110,246,.16);--green:#3ddc97;--amber:#f5a623;--red:#ff5f6d;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;padding:48px 32px 80px;}
  h1{font-size:34px;margin:0 0 8px;letter-spacing:-.02em;font-weight:800;}
  .intro{color:var(--dim);font-size:15px;max-width:720px;margin:0 0 40px;line-height:1.6;}
  h2{font-size:14px;color:var(--dimmer);font-weight:600;letter-spacing:.02em;margin:48px 0 18px;}
  .row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}
  .concept{width:300px;}
  .concept .cap{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.5;}
  .concept .cap b{color:var(--text);display:block;margin-bottom:3px;font-size:14px;}

  /* phone */
  .phone{width:300px;height:640px;background:#000;border-radius:44px;padding:10px;border:1px solid var(--border-strong);box-shadow:0 40px 90px -40px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.04);position:relative;}
  .screen{background:var(--bg);border-radius:36px;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:88px;height:26px;background:#000;border-radius:100px;z-index:5;}
  .status{display:flex;justify-content:space-between;padding:16px 22px 0;font-size:12px;font-weight:600;}
  .body{flex:1;overflow:hidden;padding:14px 16px 0;}
  .tabbar{display:flex;justify-content:space-around;padding:10px 8px 22px;border-top:1px solid var(--border);background:rgba(11,15,26,.95);}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:var(--dimmer);}
  .tab.on{color:var(--clay-2);}
  .tab.on.blue{color:var(--blue-2);}
  .tab svg{width:20px;height:20px;}

  .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .hdr .lm{height:22px;width:auto;margin-right:10px;flex:none;opacity:.95;}
  .hdr .hl{display:flex;align-items:center;min-width:0;}
  .hdr h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .hdr small{display:block;font-size:11.5px;color:var(--dimmer);font-weight:400;}
  .avatar{width:34px;height:34px;border-radius:100px;background:linear-gradient(135deg,var(--blue-1),var(--blue-2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none;}
  .avatar.b{background:linear-gradient(135deg,#1e3a8a,#3b6ef6);color:#fff;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;}
  .card .t{font-size:11px;color:var(--dimmer);margin-bottom:6px;}
  .pill{display:inline-block;font-size:9.5px;padding:3px 7px;border-radius:100px;font-weight:600;}
  .pill.clay{background:var(--accent-soft);color:var(--clay-2);}
  .pill.blue{background:rgba(59,110,246,.18);color:#8db0ff;}
  .pill.green{background:rgba(61,220,151,.15);color:var(--green);}
  .pill.amber{background:rgba(245,166,35,.15);color:var(--amber);}
  .pill.grey{background:rgba(255,255,255,.07);color:var(--dim);}
  .btn{display:flex;align-items:center;justify-content:center;padding:11px;border-radius:10px;font-size:13px;font-weight:600;}
  .btn.clay{background:linear-gradient(90deg,var(--clay-1),var(--clay-2));color:#fff;}
  .btn.blue{background:linear-gradient(90deg,var(--blue-1),var(--blue-2));color:#fff;}
  .btn.ghost{border:1px solid var(--border-strong);color:var(--text);}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--dim);}
  .bar{height:5px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--clay-1),var(--clay-2));border-radius:100px;}
  .bar.b i{background:linear-gradient(90deg,var(--blue-1),var(--blue-2));}
  .list{display:flex;flex-direction:column;gap:8px;}
  .li{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;}
  .li .w{flex:1;min-width:0;}
  .li b{display:block;font-size:12.5px;}
  .li span{font-size:10.5px;color:var(--dimmer);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .li .r{font-size:12px;font-weight:700;text-align:right;}
  .li .r em{display:block;font-style:normal;font-size:9.5px;color:var(--green);font-weight:500;}
  .search{background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--dimmer);margin-bottom:10px;}
  .chips{display:flex;gap:6px;margin-bottom:12px;overflow:hidden;}
  .chip{font-size:10.5px;padding:5px 10px;border-radius:100px;border:1px solid var(--border-strong);color:var(--dim);white-space:nowrap;}
  .chip.on{background:var(--accent-soft);border-color:var(--clay-2);color:var(--clay-2);font-weight:600;}
  .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .stat2 .card{margin:0;}
  .stat2 .t{margin-bottom:4px;}
  .vid{height:150px;background:linear-gradient(180deg,#141b30,#0b0f1a);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dimmer);font-size:11px;position:relative;margin-bottom:8px;}
  .vid::before{content:"▶";position:absolute;width:34px;height:34px;border-radius:100px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;}
  .meta{font-size:11px;color:var(--dimmer);display:flex;gap:14px;margin-top:6px;}
  .fig{height:170px;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;margin-bottom:10px;}
  .fig svg{position:absolute;inset:0;width:100%;height:100%;}
  .metric{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);padding:8px 0;border-bottom:1px solid var(--border);}
  .metric:last-child{border-bottom:none;}
  .metric b{color:var(--text);font-size:13px;}
  .thread{display:flex;flex-direction:column;gap:7px;}
  .msg{max-width:82%;padding:8px 11px;border-radius:12px;font-size:11.5px;line-height:1.4;background:var(--panel-2);border:1px solid var(--border);}
  .msg.me{align-self:flex-end;background:var(--accent-soft);border-color:rgba(59,110,246,.35);}
  .msg small{display:block;font-size:9.5px;color:var(--dimmer);margin-top:3px;}
  .msg .clip{display:inline-block;margin-top:5px;font-size:10px;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.06);}
  .sys{align-self:center;font-size:10px;color:var(--dimmer);background:var(--panel);border:1px solid var(--border);padding:4px 10px;border-radius:100px;}
  .input{margin-top:10px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--border-strong);border-radius:100px;padding:8px 12px;font-size:11.5px;color:var(--dimmer);}
  .input b{margin-left:auto;color:var(--clay-2);font-size:14px;}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 12px;}
  .slot{font-size:11px;padding:8px 0;text-align:center;border:1px solid var(--border-strong);border-radius:8px;color:var(--dim);}
  .slot.on{background:var(--accent-soft);border-color:var(--clay-2);color:var(--clay-2);font-weight:600;}
  .days{display:flex;justify-content:space-between;margin:6px 0 4px;}
  .day{width:32px;text-align:center;font-size:10px;color:var(--dimmer);}
  .day b{display:block;font-size:13px;color:var(--text);margin-top:2px;padding:5px 0;border-radius:8px;}
  .day.on b{background:var(--clay-2);color:#fff;}
  .day.dot b{position:relative;}
  .day.dot b::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;background:var(--clay-2);border-radius:100px;}
  .gate{display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%;padding-bottom:20px;}
  .gate-card{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:18px;position:relative;overflow:hidden;}
  .gate-card::before{content:"";position:absolute;inset:0;pointer-events:none;}
  .gate-card.c::before{background:radial-gradient(260px 160px at 0% 0%,rgba(59,110,246,.22),transparent 70%);}
  .gate-card.a::before{background:radial-gradient(260px 160px at 100% 0%,rgba(34,199,224,.18),transparent 70%);}
  .gate-card *{position:relative;}
  .gate-card small{font-size:10.5px;color:var(--dimmer);display:block;margin-bottom:4px;}
  .gate-card h4{margin:0 0 6px;font-size:18px;font-weight:700;letter-spacing:-.01em;}
  .gate-card p{margin:0 0 12px;font-size:11.5px;color:var(--dim);line-height:1.45;}
  .diamond{width:90px;height:90px;border:1px solid var(--border-strong);transform:rotate(45deg);margin:0 auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 36px 36px;padding:14px 16px 26px;border-top:1px solid var(--border-strong);box-shadow:0 -20px 40px rgba(0,0,0,.5);}
  .sheet .handle{width:36px;height:4px;background:var(--border-strong);border-radius:100px;margin:0 auto 12px;}
  .toast{position:absolute;top:56px;left:14px;right:14px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .toast .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--clay-2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  .toast b{display:block;font-size:11.5px;}
  .toast span{font-size:10.5px;color:var(--dimmer);}
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0 4px;}
  .heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06);}
  .heat i.l1{background:rgba(59,110,246,.3);}.heat i.l2{background:rgba(59,110,246,.6);}.heat i.l3{background:var(--clay-2);}
  .rank{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--border);}
  .rank:last-child{border:none;}
  .rank .n{width:16px;color:var(--dimmer);font-size:10.5px;}
  .rank .v{margin-left:auto;font-weight:700;}
  .splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;}
  .splash .mark{width:64px;height:64px;border:1.5px solid var(--text);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;}
  .splash h4{margin:0;font-size:22px;letter-spacing:-.01em;}
  .splash p{margin:0;font-size:11.5px;color:var(--dimmer);}
  .splash .line{position:absolute;inset:0;pointer-events:none;}

  body.light{--bg:#f4f6fb;--panel:#ffffff;--panel-2:#eef2f9;--border:rgba(10,20,40,.08);--border-strong:rgba(10,20,40,.16);--text:#0b0f1a;--dim:#4b5566;--dimmer:#7b8494;--accent-soft:rgba(59,110,246,.12);}
  body.light .phone{background:#e9edf5;border-color:rgba(10,20,40,.15);box-shadow:0 40px 90px -40px rgba(20,40,80,.35),inset 0 0 0 1px rgba(255,255,255,.6);}
  body.light .notch{background:#0b0f1a;}
  body.light .tabbar{background:rgba(255,255,255,.96);}
  body.light .vid{background:linear-gradient(180deg,#dfe6f3,#eef2f9);}
  body.light .vid::before{background:rgba(10,20,40,.15);color:#0b0f1a;}
  body.light .pill.blue,body.light .pill.clay{background:rgba(59,110,246,.12);color:#2456d8;}
  body.light .pill.green{background:rgba(22,163,74,.12);color:#15803d;}
  body.light .pill.amber{background:rgba(217,119,6,.12);color:#b45309;}
  body.light .msg.me{background:rgba(59,110,246,.1);border-color:rgba(59,110,246,.3);}
  body.light .btn.clay,body.light .btn.blue{color:#fff;}
  body.light .chip.on,body.light .slot.on{color:#2456d8;border-color:#3b6ef6;background:rgba(59,110,246,.1);}
  body.light .day.on b{background:#3b6ef6;color:#fff;}
  body.light .toast{box-shadow:0 10px 30px rgba(20,40,80,.18);}
  body.light .sheet{box-shadow:0 -20px 40px rgba(20,40,80,.12);}
  body.light .heat i{background:rgba(10,20,40,.06);}
  body.light .heat i.l1{background:rgba(59,110,246,.3);}body.light .heat i.l2{background:rgba(59,110,246,.6);}body.light .heat i.l3{background:#3b6ef6;}
  body.light .fig svg line[stroke="rgba(255,255,255,.2)"],body.light .fig svg line[stroke="rgba(255,255,255,.5)"]{stroke:rgba(10,20,40,.35);}
  body.light .splash .line path{stroke:rgba(10,20,40,.15);}
  body.light .status span,body.light .status{color:var(--text);}
  body.light .tab.on,body.light .tab.on.blue{color:#2456d8;}
  body.light .r em,body.light .big span[style*="green"]{color:#15803d!important;}
  .toggle{position:fixed;top:18px;right:22px;z-index:20;display:flex;gap:4px;background:var(--panel);border:1px solid var(--border-strong);border-radius:100px;padding:4px;}
  .toggle button{border:none;background:transparent;color:var(--dim);font-size:12.5px;padding:7px 14px;border-radius:100px;font-weight:600;}
  .toggle button.on{background:var(--text);color:var(--bg);}
</style>
</head>
