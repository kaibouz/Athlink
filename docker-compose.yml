services:
  db:
    image: postgres:16-alpine
    container_name: athlink-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: athlink
      POSTGRES_PASSWORD: athlink
      POSTGRES_DB: athlink
    volumes:
      - athlink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athlink -d athlink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  athlink_pg_data:
